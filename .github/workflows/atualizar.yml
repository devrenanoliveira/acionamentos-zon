name: Atualizar Dashboard Automaticamente

on:
  # Agendamento: todo dia 28 de cada mês às 8h BRT (11h UTC)
  # Ajuste o "28" para o dia que você finaliza os dados do mês
  schedule:
    - cron: '7 11 28 * *'

  # Disparo manual (ideal para testar ou atualizar fora do dia agendado)
  workflow_dispatch:
    inputs:
      mes_id:
        description: 'Mês no formato YYYY-MM (ex: 2026-08)'
        required: true
        default: '2026-08'
      mes_label:
        description: 'Nome do mês (ex: Agosto 2026)'
        required: true
        default: 'Agosto 2026'
      mes_periodo:
        description: 'Período exibido no dash (ex: 01–31 ago/2026)'
        required: true
        default: '01–31 ago/2026'

jobs:
  atualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessário para commitar os JSONs de volta

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Calcular mês automaticamente (modo agendado)
        if: github.event_name == 'schedule'
        run: |
          python3 -c "
          from datetime import datetime, timedelta, timezone
          BRT = timezone(timedelta(hours=-3))
          hoje = datetime.now(BRT)
          # Mês anterior ao dia 28 seria o mês atual
          mes_id   = hoje.strftime('%Y-%m')
          mes_num  = hoje.strftime('%m')
          ano      = hoje.strftime('%Y')
          meses_pt = {
            '01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril',
            '05':'Maio','06':'Junho','07':'Julho','08':'Agosto',
            '09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'
          }
          mes_label   = meses_pt[mes_num] + ' ' + ano
          ultimo_dia  = (hoje.replace(day=1) + timedelta(days=32)).replace(day=1) - timedelta(days=1)
          mes_periodo = f'01–{hoje.day:02d} {hoje.strftime(\"%b\").lower()}/{ano}'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MES_ID={mes_id}\n')
              env.write(f'MES_LABEL={mes_label}\n')
              env.write(f'MES_PERIODO={mes_periodo}\n')
          " 2>&1 || true
          # Fallback manual caso o Python falhe:
          echo "MES_ID=$(date -u +%Y-%m)" >> $GITHUB_ENV
          echo "MES_LABEL=Mês Atual" >> $GITHUB_ENV
          echo "MES_PERIODO=$(date -u +%d/%m/%Y)" >> $GITHUB_ENV

      - name: Usar mês informado manualmente
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "MES_ID=${{ github.event.inputs.mes_id }}" >> $GITHUB_ENV
          echo "MES_LABEL=${{ github.event.inputs.mes_label }}" >> $GITHUB_ENV
          echo "MES_PERIODO=${{ github.event.inputs.mes_periodo }}" >> $GITHUB_ENV

      - name: Executar script de atualização
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          SHEET_ANALITICO_URL: ${{ secrets.SHEET_ANALITICO_URL }}
          SHEET_VOLUME_URL:    ${{ secrets.SHEET_VOLUME_URL }}
          SHEET_MOTIVOS_URL:   ${{ secrets.SHEET_MOTIVOS_URL }}
          MES_ID:              ${{ env.MES_ID }}
          MES_LABEL:           ${{ env.MES_LABEL }}
          MES_PERIODO:         ${{ env.MES_PERIODO }}
        run: python atualizar_dashboard.py

      - name: Verificar arquivos gerados
        run: |
          echo "=== Arquivos em data/ ==="
          ls -lh data/
          echo "=== Meses no índice ==="
          cat data/index.json
